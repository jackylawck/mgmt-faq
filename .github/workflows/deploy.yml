name: Enterprise Deploy mgmt-faq to GitHub Pages

on:
  push:
    branches:
      - main

# Principle of Least Privilege
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Secure Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Validate Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Verified Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
                      mkdocs-material \
                      mkdocs-static-i18n \
                      pymdown-extensions \
                      jieba

      - name: Build and Sign Deployment
        run: mkdocs gh-deploy --force --clean
