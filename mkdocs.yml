site_name: mgmt-faq
site_description: 現代管理學實戰知識庫與認證導航 | Executive Management FAQ & Frameworks
site_author: Executive Governance Team
site_url: https://jackylawck.github.io/mgmt-faq/
copyright: "Copyright &copy; 2026 | Licensed under CC BY-NC 4.0"

extra:
  alternate:
    - name: 繁體中文
      link: /zh/
      lang: zh-Hant
    - name: English
      link: /en/
      lang: en
  manifest: manifest.webmanifest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jackylawck/mgmt-faq

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh-Hant
          name: 繁體中文
          build: true
          default: true
          link: /zh/
        - locale: en
          name: English
          build: true
          link: /en/
  - search:
      lang:
        - en
        - zh
      separator: '[\s\-，、。：；？!！]+'
  - tags
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      cache_safe: true

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式 / Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式 / Switch to light mode
  font:
    text: Noto Sans TC
    code: Roboto Mono
  icon:
    logo: material/compass-rose
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 全景地圖: index.md
  - 01 角色轉型與授權:
      - 模組總覽: 01-role-transition/index.md
      - Katz 三大管理技能: 01-role-transition/katz-skills.md
      - Mintzberg 10 大角色: 01-role-transition/mintzberg-roles.md
      - 授權矩陣與 90 天清單: 01-role-transition/delegation-matrix.md
