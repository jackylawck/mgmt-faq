site_name: mgmt-faq
site_description: 現代管理學實戰知識庫與認證導航 | Executive Management FAQ & Frameworks
site_author: Executive Governance Team
site_url: https://jackylawck.github.io/mgmt-faq/
copyright: "Copyright &copy; 2026 | Licensed under CC BY-NC 4.0"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jackylawck/mgmt-faq
      name: GitHub Repository
    - icon: fontawesome/solid/user-tie
      link: https://jackylawck.github.io/jackylawck/
      name: 作者主頁 / Author Homepage
    - icon: fontawesome/solid/bug
      link: https://github.com/jackylawck/mgmt-faq/issues
      name: 提交勘誤 / Report an Issue

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: zh
          name: 繁體中文
          build: true
          default: true
          site_name: 現代管理學實戰知識庫
          nav_translations:
            Overview: 全景地圖
            01-role-transition: 01 角色轉型與授權
            Role Transition Overview: 模組總覽
            Katz Three-Skill Model: Katz 三大管理技能
            Mintzberg 10 Roles: Mintzberg 10 大角色
            Delegation Matrix: 授權矩陣與 90 天清單
            02-strategy-alignment: 02 策略解構與目標對齊
            Strategy Alignment Overview: 模組總覽
            Intended vs Emergent Strategy: 意圖 vs. 湧現策略
            MBO & SMART Principles: MBO 與 SMART 邊界
            Disclaimer & Contact: 免責聲明與聯絡
        - locale: en
          name: English
          build: true
          link: /en/
          site_name: Executive Management FAQ
  - search:
      lang:
        - en
        - zh
      separator: '[\s\-，、。：；？!！]+'
  - tags

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式 / Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式 / Switch to light mode
  font:
    text: Noto Sans TC
    code: Roboto Mono
  icon:
    logo: material/compass-rose
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Overview: index.md
  - 01-role-transition:
      - Role Transition Overview: 01-role-transition/index.md
      - Katz Three-Skill Model: 01-role-transition/katz-skills.md
      - Mintzberg 10 Roles: 01-role-transition/mintzberg-roles.md
      - Delegation Matrix: 01-role-transition/delegation-matrix.md
  - 02-strategy-alignment:
      - Strategy Alignment Overview: 02-strategy-alignment/index.md
      - Intended vs Emergent Strategy: 02-strategy-alignment/intended-vs-emergent.md
      - MBO & SMART Principles: 02-strategy-alignment/mbo-smart.md
  - Disclaimer & Contact: disclaimer.md
